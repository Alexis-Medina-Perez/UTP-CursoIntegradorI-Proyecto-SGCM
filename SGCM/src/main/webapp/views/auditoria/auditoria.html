<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGCM</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="auditoria.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js" crossorigin="anonymous"></script>
</head>

<body class="bg-light">
    <div class="layout">
        <aside class="sidebar bg-primary text-white p-3 d-flex flex-column shadow-sm">
            <div class="d-flex align-items-center justify-content-between mb-4">
                <h2 class="h4 mb-0 fw-bold">SGCM</h2>
                <button class="btn btn-outline-light btn-sm d-lg-none" onclick="toggleSidebar()" type="button">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <ul class="nav nav-pills flex-column gap-2">

                <li class="nav-item">
                    <a href="../dashboard/dashboard.html"
                        class="btn btn-primary w-100 text-start d-flex align-items-center gap-2">
                        <i class="fa-solid fa-house"></i>
                        <span class="sidebar-label">Dashboard</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a href="../campanias/campanias.html"
                        class="btn btn-primary w-100 text-start d-flex align-items-center gap-2">
                        <i class="fa-solid fa-bullhorn"></i>
                        <span class="sidebar-label">Campañas</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a href="../tareas/tareas.html"
                        class="btn btn-primary w-100 text-start d-flex align-items-center gap-2">
                        <i class="fa-solid fa-list-check"></i>
                        <span class="sidebar-label">Tareas</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a href="../notificaciones/notificaciones.html"
                        class="btn btn-primary w-100 text-start d-flex align-items-center gap-2">
                        <i class="fa-solid fa-bell"></i>
                        <span class="sidebar-label">Notificaciones</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a href="../reportes/reportes.html"
                        class="btn btn-primary w-100 text-start d-flex align-items-center gap-2">
                        <i class="fa-solid fa-chart-line"></i>
                        <span class="sidebar-label">Reportes</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a href="../usuarios/usuarios.html"
                        class="btn btn-primary w-100 text-start d-flex align-items-center gap-2">
                        <i class="fa-solid fa-users"></i>
                        <span class="sidebar-label">Usuarios</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a href="auditoria.html" class="btn btn-primary w-100 text-start d-flex align-items-center gap-2">
                        <i class="fa-solid fa-clipboard-list"></i>
                        <span class="sidebar-label">Auditoría</span>
                    </a>
                </li>

            </ul>
        </aside>

        <div class="main flex-grow-1 d-flex flex-column">
            <header class="navbar navbar-light bg-white border-bottom px-3 py-2 shadow-sm">
                <button class="btn btn-light border toggle-btn me-3" onclick="toggleSidebar()" type="button">
                    <i class="fa-solid fa-bars"></i>
                </button>

                <div class="flex-grow-1 me-3">
                    <input class="form-control" placeholder="Buscar..." />
                </div>

                <button class="btn btn-danger d-flex align-items-center gap-2 logout-btn" onclick="logout()"
                    type="button">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Salir</span>
                </button>
            </header>

            <div id="contenido" class="flex-grow-1 p-4">



                <div class="container-fluid">

                    <!-- HEADER -->
                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div>
                            <h2 class="fw-bold">Auditoría del Sistema</h2>
                            <p class="text-muted">Historial completo de operaciones</p>
                        </div>

                        <button class="btn btn-primary">
                            <i class="fa fa-download"></i> Exportar Logs
                        </button>
                    </div>

                    <!-- FILTROS -->
                    <div class="card p-3 mb-4 shadow-sm">
                        <div class="row g-2">

                            <div class="col-md-6">
                                <input id="buscador" class="form-control"
                                    placeholder="Buscar por usuario u operación..." oninput="filtrarLogs()">
                            </div>

                            <div class="col-md-2">
                                <select id="filtroOperacion" class="form-select" onchange="filtrarLogs()">
                                    <option value="">Todas</option>
                                    <option value="CREATE">Create</option>
                                    <option value="UPDATE">Update</option>
                                    <option value="DELETE">Delete</option>
                                </select>
                            </div>

                            <div class="col-md-2">
                                <select id="filtroTabla" class="form-select" onchange="filtrarLogs()">
                                    <option value="">Todas</option>
                                    <option value="usuario">Usuario</option>
                                    <option value="campaña">Campaña</option>
                                    <option value="tarea">Tarea</option>
                                </select>
                            </div>

                            <div class="col-md-2">
                                <select id="filtroDias" class="form-select" onchange="filtrarLogs()">
                                    <option value="7">Últimos 7 días</option>
                                    <option value="30">Últimos 30 días</option>
                                </select>
                            </div>

                        </div>
                    </div>

                    <!-- KPIs -->
                    <div class="row mb-4">
                        <div class="col-md-3">
                            <div class="card p-3">
                                <h6>Total Logs</h6>
                                <h3 id="totalLogs"></h3>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="card p-3">
                                <h6>Creaciones</h6>
                                <h3 class="text-success" id="totalCreate"></h3>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="card p-3">
                                <h6>Actualizaciones</h6>
                                <h3 class="text-primary" id="totalUpdate"></h3>
                            </div>
                        </div>
                        <div class="col-md-3">
                            <div class="card p-3">
                                <h6>Eliminaciones</h6>
                                <h3 class="text-danger" id="totalDelete"></h3>
                            </div>
                        </div>
                    </div>

                    <!-- TABLA -->
                    <div class="card shadow-sm">
                        <div class="table-responsive">
                            <table class="table align-middle">
                                <thead>
                                    <tr>
                                        <th>Fecha</th>
                                        <th>Usuario</th>
                                        <th>Operación</th>
                                        <th>Tabla</th>
                                        <th>ID</th>
                                        <th>Descripción</th>
                                        <th>IP</th>
                                    </tr>
                                </thead>

                                <tbody id="tablaLogs"></tbody>
                            </table>
                        </div>
                    </div>

                    <!-- PAGINACIÓN -->
                    <nav class="mt-3">
                        <ul class="pagination justify-content-end" id="paginacion"></ul>
                    </nav>
                </div>



            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="auditoria.js"></script>
</body>

</html>
