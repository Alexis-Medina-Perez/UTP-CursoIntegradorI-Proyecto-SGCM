<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGCM</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="usuarios.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js" crossorigin="anonymous"></script>
</head>

<body class="bg-light">
    <div class="layout">
        <aside class="sidebar bg-primary text-white p-3 d-flex flex-column shadow-sm">
            <div class="d-flex align-items-center justify-content-between mb-4">
                <h2 class="h4 mb-0 fw-bold">SGCM</h2>
                <button class="btn btn-outline-light btn-sm d-lg-none" onclick="toggleSidebar()" type="button">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <ul class="nav nav-pills flex-column gap-2">

                <li class="nav-item">
                    <a href="../dashboard/dashboard.html"
                        class="btn btn-primary w-100 text-start d-flex align-items-center gap-2">
                        <i class="fa-solid fa-house"></i>
                        <span class="sidebar-label">Dashboard</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a href="../campanias/campanias.html"
                        class="btn btn-primary w-100 text-start d-flex align-items-center gap-2">
                        <i class="fa-solid fa-bullhorn"></i>
                        <span class="sidebar-label">Campañas</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a href="../tareas/tareas.html"
                        class="btn btn-primary w-100 text-start d-flex align-items-center gap-2">
                        <i class="fa-solid fa-list-check"></i>
                        <span class="sidebar-label">Tareas</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a href="../notificaciones/notificaciones.html"
                        class="btn btn-primary w-100 text-start d-flex align-items-center gap-2">
                        <i class="fa-solid fa-bell"></i>
                        <span class="sidebar-label">Notificaciones</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a href="../reportes/reportes.html"
                        class="btn btn-primary w-100 text-start d-flex align-items-center gap-2">
                        <i class="fa-solid fa-chart-line"></i>
                        <span class="sidebar-label">Reportes</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a href="usuarios.html" class="btn btn-primary w-100 text-start d-flex align-items-center gap-2">
                        <i class="fa-solid fa-users"></i>
                        <span class="sidebar-label">Usuarios</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a href="../auditoria/auditoria.html"
                        class="btn btn-primary w-100 text-start d-flex align-items-center gap-2">
                        <i class="fa-solid fa-clipboard-list"></i>
                        <span class="sidebar-label">Auditoría</span>
                    </a>
                </li>

            </ul>
        </aside>

        <div class="main flex-grow-1 d-flex flex-column">
            <header class="navbar navbar-light bg-white border-bottom px-3 py-2 shadow-sm">
                <button class="btn btn-light border toggle-btn me-3" onclick="toggleSidebar()" type="button">
                    <i class="fa-solid fa-bars"></i>
                </button>

                <div class="flex-grow-1 me-3">
                    <input class="form-control" placeholder="Buscar..." />
                </div>

                <button class="btn btn-danger d-flex align-items-center gap-2 logout-btn" onclick="logout()"
                    type="button">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Salir</span>
                </button>
            </header>

            <div id="contenido" class="flex-grow-1 p-4">



                <div class="card shadow-sm">
                    <div class="card-body">

                        <!-- HEADER -->
                        <div class="d-flex justify-content-between mb-3">
                            <input id="buscarUsuario" class="form-control w-50" placeholder="Buscar usuario..."
                                oninput="filtrarUsuarios()">

                            <button class="btn btn-primary" onclick="abrirModalUsuario()">
                                <i class="fa fa-plus"></i> Nuevo
                            </button>
                        </div>

                        <!-- TABLA -->
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead>
                                    <tr>
                                        <th>Apellidos y Nombres</th>
                                        <th>Usuario</th>
                                        <th>Correo</th>
                                        <th>Estado</th>
                                        <th>Roles</th>
                                        <th>Acciones</th>
                                    </tr>
                                </thead>
                                <tbody id="tablaUsuarios"></tbody>
                            </table>
                        </div>

                    </div>
                </div>


                <div class="modal fade" id="modalUsuario">
                    <div class="modal-dialog modal-lg">
                        <div class="modal-content">

                            <div class="modal-header">
                                <h5 class="modal-title">Usuario</h5>
                                <button class="btn-close" data-bs-dismiss="modal"></button>
                            </div>

                            <div class="modal-body">
                                <input type="hidden" id="idUsuario">

                                <input id="username" class="form-control mb-2" placeholder="Username">
                                <input id="password" type="password" class="form-control mb-2" placeholder="Password">

                                <input id="nombres" class="form-control mb-2" placeholder="Nombres">
                                <input id="apellidos" class="form-control mb-2" placeholder="Apellidos">
                                <input id="correo" class="form-control mb-2" placeholder="Correo">

                                <!-- ROLES -->
                                <h6 class="mt-3">Roles</h6>
                                <div id="listaRoles"></div>

                                <select id="selectRol" class="form-select mt-2"></select>
                                <button class="btn btn-outline-primary mt-2" onclick="agregarRol()">
                                    Agregar Rol
                                </button>
                            </div>

                            <div class="modal-footer">
                                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                <button class="btn btn-primary" onclick="guardarUsuario()">Guardar</button>
                            </div>

                        </div>
                    </div>
                </div>


                <div class="modal fade" id="modalEliminar">
                    <div class="modal-dialog">
                        <div class="modal-content">

                            <div class="modal-header">
                                <h5>Confirmar eliminación</h5>
                            </div>

                            <div class="modal-body">
                                ¿Seguro que deseas eliminar este usuario?
                            </div>

                            <div class="modal-footer">
                                <button class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                                <button class="btn btn-danger" onclick="confirmarEliminar()">Eliminar</button>
                            </div>

                        </div>
                    </div>
                </div>



            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="usuarios.js"></script>
</body>

</html>
