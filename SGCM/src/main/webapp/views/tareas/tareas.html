<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SGCM</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="tareas.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js" crossorigin="anonymous"></script>
</head>

<body class="bg-light">
    <div class="layout">
        <aside class="sidebar bg-primary text-white p-3 d-flex flex-column shadow-sm">
            <div class="d-flex align-items-center justify-content-between mb-4">
                <h2 class="h4 mb-0 fw-bold">SGCM</h2>
                <button class="btn btn-outline-light btn-sm d-lg-none" onclick="toggleSidebar()" type="button">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <ul class="nav nav-pills flex-column gap-2">

                <li class="nav-item">
                    <a href="../dashboard/dashboard.html" class="btn btn-primary w-100 text-start d-flex align-items-center gap-2">
                        <i class="fa-solid fa-house"></i>
                        <span class="sidebar-label">Dashboard</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a href="../campanias/campanias.html"
                        class="btn btn-primary w-100 text-start d-flex align-items-center gap-2">
                        <i class="fa-solid fa-bullhorn"></i>
                        <span class="sidebar-label">Campañas</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a href="tareas.html"
                        class="btn btn-primary w-100 text-start d-flex align-items-center gap-2">
                        <i class="fa-solid fa-list-check"></i>
                        <span class="sidebar-label">Tareas</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a href="../notificaciones/notificaciones.html"
                        class="btn btn-primary w-100 text-start d-flex align-items-center gap-2">
                        <i class="fa-solid fa-bell"></i>
                        <span class="sidebar-label">Notificaciones</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a href="../reportes/reportes.html"
                        class="btn btn-primary w-100 text-start d-flex align-items-center gap-2">
                        <i class="fa-solid fa-chart-line"></i>
                        <span class="sidebar-label">Reportes</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a href="../usuarios/usuarios.html"
                        class="btn btn-primary w-100 text-start d-flex align-items-center gap-2">
                        <i class="fa-solid fa-users"></i>
                        <span class="sidebar-label">Usuarios</span>
                    </a>
                </li>

                <li class="nav-item">
                    <a href="../auditoria/auditoria.html"
                        class="btn btn-primary w-100 text-start d-flex align-items-center gap-2">
                        <i class="fa-solid fa-clipboard-list"></i>
                        <span class="sidebar-label">Auditoría</span>
                    </a>
                </li>

            </ul>
        </aside>

        <div class="main flex-grow-1 d-flex flex-column">
            <header class="navbar navbar-light bg-white border-bottom px-3 py-2 shadow-sm">
                <button class="btn btn-light border toggle-btn me-3" onclick="toggleSidebar()" type="button">
                    <i class="fa-solid fa-bars"></i>
                </button>

                <div class="flex-grow-1 me-3">
                    <input class="form-control" placeholder="Buscar..." />
                </div>

                <button class="btn btn-danger d-flex align-items-center gap-2 logout-btn" onclick="logout()"
                    type="button">
                    <i class="fa-solid fa-right-from-bracket"></i>
                    <span>Salir</span>
                </button>
            </header>

            <div id="contenido" class="flex-grow-1 p-4">


                <div class="container-fluid p-0">
                    <div
                        class="d-flex flex-column flex-md-row justify-content-between align-items-md-center gap-2 mb-4">
                        <div>
                            <h1 id="tituloTareas" class="h3 fw-bold mb-1">Gestión de Tareas</h1>
                            <p class="text-muted mb-0">Planea, prioriza y avanza tus tareas con un tablero tipo planner.
                            </p>
                        </div>

                        <button class="btn btn-primary" onclick="abrirModal()" type="button">
                            <i class="fa fa-plus me-2"></i> Nueva Tarea
                        </button>
                    </div>

                    <div class="card border-0 shadow-sm mb-4">
                        <div class="card-body">
                            <div class="row g-3 align-items-center">
                                <div class="col-12 col-md-6">
                                    <div class="input-group">
                                        <span class="input-group-text bg-white">
                                            <i class="fa fa-search"></i>
                                        </span>
                                        <input id="buscar" class="form-control" placeholder="Buscar tareas..."
                                            oninput="filtrarTareas()">
                                    </div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <select id="filtroEstado" class="form-select" onchange="filtrarTareas()">
                                        <option value="TODOS">Todos los estados</option>
                                        <option value="PENDIENTE">Pendiente</option>
                                        <option value="EN PROCESO">En proceso</option>
                                        <option value="COMPLETADA">Completada</option>
                                        <option value="CANCELADA">Cancelada</option>
                                    </select>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div id="kanbanBoard" class="kanban-board"></div>
                </div>

                <div class="modal fade" id="modalTarea" tabindex="-1" aria-hidden="true">
                    <div class="modal-dialog modal-xl">
                        <div class="modal-content">
                            <div class="modal-header">
                                <h5 class="modal-title" id="modalTareaTitle">Nueva Tarea</h5>
                                <button type="button" class="btn-close" onclick="cerrarModal()"></button>
                            </div>
                            <div class="modal-body">
                                <form id="formTarea">
                                    <input type="hidden" id="idTarea">

                                    <div class="row g-3">
                                        <div class="col-12 col-md-6">
                                            <label class="form-label">Nombre</label>
                                            <input id="nombre" class="form-control" placeholder="Nombre de la tarea">
                                        </div>
                                        <div class="col-12 col-md-6">
                                            <label class="form-label">Campaña</label>
                                            <select id="idCampania" class="form-select"></select>
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label">Descripción</label>
                                            <textarea id="descripcion" class="form-control" rows="3"
                                                placeholder="Descripción"></textarea>
                                        </div>
                                        <div class="col-12 col-md-4">
                                            <label class="form-label">Estado</label>
                                            <select id="idEstadoTarea" class="form-select">
                                                <option value="1">Pendiente</option>
                                                <option value="2">En proceso</option>
                                                <option value="3">Completada</option>
                                                <option value="4">Cancelada</option>
                                            </select>
                                        </div>
                                        <div class="col-12 col-md-4">
                                            <label class="form-label">Prioridad</label>
                                            <select id="idPrioridadTarea" class="form-select">
                                                <option value="1">Baja</option>
                                                <option value="2">Media</option>
                                                <option value="3">Alta</option>
                                            </select>
                                        </div>
                                        <div class="col-12 col-md-4">
                                            <label class="form-label">Responsable</label>
                                            <select id="idUsuarioResponsable" class="form-select"></select>
                                        </div>
                                        <div class="col-12 col-md-6">
                                            <label class="form-label">Fecha de Inicio</label>
                                            <input id="fechaInicio" type="date" class="form-control">
                                        </div>
                                        <div class="col-12 col-md-6">
                                            <label class="form-label">Fecha Límite</label>
                                            <input id="fechaLimite" type="date" class="form-control">
                                        </div>
                                        <div class="col-12">
                                            <label class="form-label">Porcentaje de avance</label>
                                            <input id="porcentajeAvance" type="number" min="0" max="100"
                                                class="form-control" placeholder="0-100">
                                        </div>
                                    </div>
                                </form>

                                <div class="border-top mt-4 pt-3">
                                    <div class="d-flex justify-content-between align-items-center mb-2">
                                        <h6 class="fw-bold mb-0">Comentarios</h6>
                                        <span class="text-muted small">Mantén la conversación en contexto</span>
                                    </div>
                                    <div id="listaComentarios" class="comment-list mb-3"></div>
                                    <div class="input-group">
                                        <textarea id="nuevoComentario" class="form-control" rows="2"
                                            placeholder="Agregar un comentario..."></textarea>
                                        <button class="btn btn-outline-primary" type="button"
                                            onclick="guardarComentario()">Enviar</button>
                                    </div>
                                </div>
                            </div>
                            <div class="modal-footer">
                                <button id="btnCancelarTarea" type="button" class="btn btn-secondary"
                                    onclick="cerrarModal()">Cancelar</button>
                                <button id="btnGuardarTarea" type="button" class="btn btn-primary"
                                    onclick="guardarOActualizar()">Guardar</button>
                            </div>
                        </div>
                    </div>
                </div>



            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="tareas.js"></script>
</body>

</html>
